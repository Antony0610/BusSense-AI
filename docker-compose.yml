# ==============================================================================
# BusSense AI - Local & Staging Orchestration (Docker Compose)
# ==============================================================================
# Services:
# - backend: FastAPI ASGI Intelligence Service (Port 8000)
# - frontend: Next.js 14 Authority Operations Console (Port 3000)
#
# IMPORTANT:
# - Database is provided by managed Supabase PostgreSQL (not local container).
# - Client browsers run on the host machine outside Docker, so NEXT_PUBLIC_API_URL
#   must point to an address accessible by the browser (default: http://localhost:8000/api).
# - Pass secrets via .env or runtime environment. Never hardcode credentials here.
# ==============================================================================

version: "3.8"

networks:
  bussense-network:
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # FastAPI Intelligence Platform Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bussense-backend
    restart: unless-stopped
    networks:
      - bussense-network
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - DEBUG=${DEBUG:-False}
      - DEMO_MODE=${DEMO_MODE:-False}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - SIMULATION_INTERVAL_SECONDS=${SIMULATION_INTERVAL_SECONDS:-2}
      - DEFAULT_TRANSIT_CITY=${DEFAULT_TRANSIT_CITY:-Kochi, Kerala}
      - CV_MODE=${CV_MODE:-SIMULATION}
    volumes:
      - ./yolov8n.pt:/app/yolov8n.pt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ----------------------------------------------------------------------------
  # Next.js Authority Operations Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    container_name: bussense-authority
    restart: unless-stopped
    networks:
      - bussense-network
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
