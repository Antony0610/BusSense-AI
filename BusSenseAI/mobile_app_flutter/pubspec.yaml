name: bussense_ai_passenger
description: BusSense AI Passenger Mobile App built with Flutter for climate-smart public & private bus transit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  latlong2: ^0.9.1
  flutter_map: ^6.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
