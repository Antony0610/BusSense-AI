<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusSense AI Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1720;
      --surface: #12232e;
      --surface-accent: #1a2f3d;
      --primary: #00796b;
      --primary-accent: #26a69a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --radius: 24px;
      --shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 50% 25%, rgba(38, 166, 154, 0.18), transparent 70%);
    }
    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-block;
      background: rgba(38, 166, 154, 0.15);
      color: var(--primary-accent);
      border: 1px solid rgba(38, 166, 154, 0.35);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .feature-item {
      background: var(--surface-accent);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 0.85rem 0.5rem;
      text-align: center;
    }
    .feature-item span {
      display: block;
      font-size: 1.25rem;
      margin-bottom: 0.2rem;
    }
    .feature-item label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.05rem 1.5rem;
      border-radius: 18px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.25 ease;
      letter-spacing: 0.01em;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-accent));
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 121, 107, 0.4);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚍 BUSSENSE AI MANAGEMENT HUB</div>
    <h1>BusSense AI Platform</h1>
    <p>Real-time bus crowding analytics, AI passenger demand forecasting, and fleet management for public and private transport.</p>

    <div class="features-grid">
      <div class="feature-item">
        <span>📊</span>
        <label>Live Maps</label>
      </div>
      <div class="feature-item">
        <span>🧠</span>
        <label>AI Demand</label>
      </div>
      <div class="feature-item">
        <span>📱</span>
        <label>Flutter App</label>
      </div>
    </div>

    <div class="actions">
      <a href="/dashboard/index.html" class="btn btn-primary">📊 Open Authority Control Center</a>
      <a href="/mobile_app/index.html" class="btn btn-secondary">📱 Open Passenger App Simulator</a>
      <a href="/api/health" class="btn btn-secondary">⚡ REST API Diagnostics</a>
    </div>
  </div>
</body>
</html>
