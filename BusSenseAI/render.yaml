services:
  - type: web
    name: bussense-ai
    runtime: python
    rootDir: .
    buildCommand: find . -name "requirements.txt" -exec pip install -r {} \;
    startCommand: python backend/app.py || python app.py
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.11.9
